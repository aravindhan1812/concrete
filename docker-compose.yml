services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: concrete
      POSTGRES_PASSWORD: concrete
      POSTGRES_DB: concrete
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concrete"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://concrete:concrete@db:5432/concrete
      JWT_ACCESS_SECRET: dev-access-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      CORS_ORIGIN: http://localhost:5173
      PORT: 3000
      S3_ENDPOINT: http://minio:9000            # API → storage (inside the compose network)
      S3_PUBLIC_ENDPOINT: http://localhost:9000  # what presigned URLs point browsers/phones at
      S3_BUCKET: concrete
      S3_ACCESS_KEY: concrete
      S3_SECRET_KEY: concrete-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # S3-compatible object storage for photos, drawings and documents (use S3 / R2 in production).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: concrete
      MINIO_ROOT_PASSWORD: concrete-secret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket once MinIO is up.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 concrete concrete-secret &&
                  mc mb --ignore-existing local/concrete"

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
